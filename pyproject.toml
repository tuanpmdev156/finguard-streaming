[project]
name = "finguard-streaming"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tuanpmdev156", email = "tuanpmdev156@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.1",
    "dbt-bigquery>=1.12.1",
    "faker>=40.44.0",
    "google-cloud-bigquery>=3.46.2",
    "google-cloud-storage>=3.1.1",
    "pandas>=3.1.0",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.0",
    "pyspark>=4.2.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
finguard-streaming = "finguard_streaming:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
