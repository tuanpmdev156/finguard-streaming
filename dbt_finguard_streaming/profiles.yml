dbt_finguard_streaming:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'fraud-risk-analytics-131026') }}"
      dataset: finguard_staging
      threads: 4
      keyfile: "{{ env_var('DBT_GOOGLE_KEYFILE', '/opt/airflow/credentials/finguard-sa-key.json') }}"
      location: "{{ env_var('DBT_LOCATION', 'us-central1') }}"
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 1
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'fraud-risk-analytics-131026') }}"
      dataset: finguard_staging
      threads: 4
      location: "{{ env_var('DBT_LOCATION', 'us-central1') }}"
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 1


